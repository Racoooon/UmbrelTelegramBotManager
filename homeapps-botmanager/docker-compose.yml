version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: homeapps-botmanager_web_1
      APP_PORT: 8080

  web:
    image: python:3.12-slim-bookworm
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    init: true
    working_dir: /opt/default-src
    entrypoint: ["bash", "/opt/default-src/entrypoint.sh"]
    environment:
      FXBOT_DATA_DIR: /data
      FXBOT_PACKAGED_SRC: /opt/default-src
      FXBOT_WEB_HOST: 0.0.0.0
      FXBOT_WEB_PORT: 8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HOME: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/src:/opt/default-src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s
