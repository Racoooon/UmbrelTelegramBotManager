manifestVersion: 1.2
id: homeapps-botmanager
name: Telegram Botmanager
tagline: Manage ThePirateBot — X, Instagram and crypto on Telegram
icon: https://raw.githubusercontent.com/Racoooon/UmbrelTelegramBotManager/main/homeapps-botmanager/icon.svg
category: social
version: "1.0.4"
port: 3847
description: >-
  Telegram Botmanager runs ThePirateBot on your Umbrel.


  ThePirateBot rewrites x.com / twitter.com links to FixupX and instagram.com
  links to an embed host (kirkstagram by default, switchable in Settings) so
  Telegram can show the media. Delete is limited to the original poster.
  Link-only originals are removed when the bot is a group admin.


  Crypto commands: /p /c /ath /trending /dom (CoinGecko).


  Open this app to paste the BotFather token, switch reply language
  (English / Deutsch), start / stop / restart ThePirateBot, read logs, and
  edit every relevant source file — the whole bot lives in thepiratebot.py.
